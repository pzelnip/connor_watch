name: Update game data

on:
  schedule:
    # Hourly, 8 AM to 11 PM Pacific Standard Time (UTC-8). Cron runs in UTC:
    # 16:00-23:00 UTC is 8 AM-3 PM PST, 00:00-07:00 UTC is 4 PM-11 PM PST.
    # While daylight time is in effect (PDT, UTC-7) this shifts to 9 AM-midnight.
    - cron: "0 16-23,0-7 * * *"
  workflow_dispatch:

permissions:
  contents: write # push the updated games.json
  actions: write # trigger the deploy workflow

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest stats
        run: python3 scrape.py

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start
      # the deploy explicitly, and only when the data actually changed.
      - name: Commit and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet docs/games.json; then
            echo "No new data"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/games.json
          git commit -m "Update game data"
          git push
          gh workflow run deploy.yml --ref main
