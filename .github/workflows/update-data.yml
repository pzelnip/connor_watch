name: Update game data

on:
  schedule:
    # Hourly, at 17 past: GitHub's scheduler is busiest at :00, where runs are
    # often delayed or dropped.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write # push the updated games.json
  actions: write # trigger the deploy workflow

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest stats
        run: python3 scrape.py

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start
      # the deploy explicitly, and only when the data actually changed.
      - name: Commit and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet docs/games.json; then
            echo "No new data"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/games.json
          git commit -m "Update game data"
          git push
          gh workflow run deploy.yml --ref main
